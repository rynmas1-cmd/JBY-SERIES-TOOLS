<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook UID Checker — JBY Series Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff3366;
      --border-cyan: rgba(0, 240, 255, 0.25);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
    }

    .nav-back {
      display: inline-block;
      color: var(--neon-cyan);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 14px;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--border-cyan);
      border-radius: 6px;
      color: var(--neon-green);
      font-family: 'Fira Code', monospace;
      margin-bottom: 16px;
      resize: vertical;
      font-size: 0.8rem;
    }

    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    input, select {
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--border-cyan);
      color: var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    button {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--neon-cyan);
      color: var(--bg);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .btn-stop {
      border-color: var(--neon-red);
      color: var(--neon-red);
    }
    .btn-stop:hover {
      background: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 15px var(--neon-red);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border-cyan);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--neon-cyan);
      transition: width 0.2s;
    }

    .counter {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .counter-live { color: var(--neon-green); font-weight: bold; }
    .counter-dead { color: var(--neon-red); font-weight: bold; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      margin-top: 24px;
    }

    .btn-export {
      padding: 4px 10px;
      font-size: 0.75rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 0.75rem;
      background: rgba(3, 7, 18, 0.6);
    }

    th, td {
      border: 1px solid var(--border-cyan);
      padding: 8px 12px;
      text-align: left;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: var(--neon-cyan);
    }

    .table-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-cyan);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-back">◄ KEMBALI KE DASHBOARD</a>
    <h1>FACEBOOK CHECKER PRO</h1>

    <textarea id="listData" placeholder="Masukkan daftar UID atau Cookies (1 per baris)..."></textarea>

    <div class="controls-row">
      <label>Speed:</label>
      <input type="number" id="speedInput" value="50" style="width: 80px;">
      <button id="btnStart" onclick="startCheck()">⚡ Mulai Cek</button>
      <button id="btnStop" class="btn-stop" onclick="stopCheck()">■ Stop</button>
    </div>

    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="counter">
      <div>Total: <span id="txtTotal">0</span></div>
      <div class="counter-live">Live: <span id="txtLive">0</span></div>
      <div class="counter-dead">Dead: <span id="txtDead">0</span></div>
    </div>

    <!-- LIVE ACCOUNTS -->
    <div class="section-header">
      <span style="color: var(--neon-green); font-weight: bold;">🟢 Live Accounts</span>
      <div>
        <button class="btn-export" onclick="copyLive('uid')">C UID</button>
        <button class="btn-export" onclick="copyLive('ori')">C Ori</button>
      </div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>UID</th>
            <th>Cookies</th>
            <th>Waktu</th>
          </tr>
        </thead>
        <tbody id="tbLive"></tbody>
      </table>
    </div>

    <!-- DEAD ACCOUNTS -->
    <div class="section-header">
      <span style="color: var(--neon-red); font-weight: bold;">🔴 Dead Accounts</span>
      <div>
        <button class="btn-export" onclick="copyDead('uid')">C UID</button>
      </div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>UID</th>
            <th>Cookies</th>
            <th>Waktu</th>
          </tr>
        </thead>
        <tbody id="tbDead"></tbody>
      </table>
    </div>
  </div>

  <script>
    let isRunning = false;
    let liveData = [];
    let deadData = [];

    function extractUID(str) {
      const cUser = str.match(/c_user=([0-9]+)/);
      if (cUser) return cUser[1];
      const match = str.match(/^([0-9]+)/);
      return match ? match[1] : 'N/A';
    }

    async function checkCookie(cookieStr) {
      const uid = extractUID(cookieStr);
      
      // Jika hanya UID biasa tanpa cookie
      if (!cookieStr.includes('c_user=')) {
        try {
          const res = await fetch(`https://graph.facebook.com/${uid}/picture?type=normal&redirect=false`);
          const data = await res.json();
          return (data && data.data && data.data.url && !data.error);
        } catch (e) {
          return false;
        }
      }

      // Validasi cookie presisi via Facebook mbasic/graph token
      try {
        const tokenMatch = cookieStr.match(/access_token=(EAAA[a-zA-Z0-9]+)/);
        if (tokenMatch) {
          const res = await fetch(`https://graph.facebook.com/v18.0/me?access_token=${tokenMatch[1]}`);
          const data = await res.json();
          return !!(data && data.id && !data.error);
        }

        // Cek parameter wajib cookie FB aktif: c_user dan xs
        const hasCuser = cookieStr.includes('c_user=');
        const hasXs = cookieStr.includes('xs=');
        
        if (!hasCuser || !hasXs) return false;

        // Cek ketersediaan profil publik UID
        const res = await fetch(`https://graph.facebook.com/${uid}/picture?type=normal&redirect=false`);
        const data = await res.json();
        return !!(data && data.data && data.data.url && !data.error);
      } catch (e) {
        return false;
      }
    }

    async function startCheck() {
      const rawText = document.getElementById('listData').value.trim();
      if (!rawText) return alert("Masukkan data terlebih dahulu!");

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      isRunning = true;
      liveData = [];
      deadData = [];

      document.getElementById('txtTotal').innerText = lines.length;
      document.getElementById('txtLive').innerText = '0';
      document.getElementById('txtDead').innerText = '0';
      document.getElementById('tbLive').innerHTML = '';
      document.getElementById('tbDead').innerHTML = '';
      document.getElementById('progressFill').style.width = '0%';

      let completed = 0;
      const speed = parseInt(document.getElementById('speedInput').value) || 10;

      for (let i = 0; i < lines.length; i += speed) {
        if (!isRunning) break;

        const batch = lines.slice(i, i + speed);
        const promises = batch.map(async (line) => {
          const isLive = await checkCookie(line);
          const uid = extractUID(line);
          const time = new Date().toLocaleTimeString();

          if (isLive) {
            liveData.push({ uid, line });
            document.getElementById('tbLive').innerHTML += `<tr><td>${uid}</td><td title="${line}">${line}</td><td>${time}</td></tr>`;
          } else {
            deadData.push({ uid, line });
            document.getElementById('tbDead').innerHTML += `<tr><td>${uid}</td><td title="${line}">${line}</td><td>${time}</td></tr>`;
          }

          completed++;
          const percent = ((completed / lines.length) * 100).toFixed(1);
          document.getElementById('progressFill').style.width = percent + '%';
          document.getElementById('txtLive').innerText = liveData.length;
          document.getElementById('txtDead').innerText = deadData.length;
        });

        await Promise.all(promises);
      }

      isRunning = false;
    }

    function stopCheck() {
      isRunning = false;
    }

    function copyLive(type) {
      let text = '';
      if (type === 'uid') text = liveData.map(d => d.uid).join('\n');
      if (type === 'ori') text = liveData.map(d => d.line).join('\n');
      navigator.clipboard.writeText(text);
      alert('Berhasil disalin ke clipboard!');
    }

    function copyDead(type) {
      let text = deadData.map(d => d.uid).join('\n');
      navigator.clipboard.writeText(text);
      alert('Berhasil disalin ke clipboard!');
    }
  </script>
</body>
</html>
