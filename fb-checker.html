<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Checker — JBY Series Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.85);
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff3366;
      --border-cyan: rgba(0, 240, 255, 0.25);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      font-family: 'Fira Code', monospace;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
    }

    .nav-back {
      display: inline-block;
      color: var(--neon-cyan);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--border-cyan);
      border-radius: 6px;
      color: var(--neon-green);
      font-family: 'Fira Code', monospace;
      margin-bottom: 20px;
      resize: vertical;
      font-size: 0.8rem;
    }

    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .speed-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select {
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--border-cyan);
      color: var(--neon-cyan);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      cursor: pointer;
    }

    button {
      padding: 12px 24px;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--neon-cyan);
      color: var(--bg);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    button:disabled {
      border-color: var(--text-muted);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .counter {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .counter-live { color: var(--neon-green); }
    .counter-dead { color: var(--neon-red); }

    .result-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .res-panel {
      background: rgba(3, 7, 18, 0.8);
      border: 1px solid var(--border-cyan);
      padding: 16px;
      border-radius: 6px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.75rem;
      word-break: break-all;
    }

    .res-panel.live { border-color: var(--neon-green); color: var(--neon-green); }
    .res-panel.dead { border-color: var(--neon-red); color: var(--neon-red); }

    @media (max-width: 600px) {
      .result-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-back">◄ KEMBALI KE DASHBOARD</a>
    <h1>FACEBOOK LIVE CHECKER</h1>

    <textarea id="listData" placeholder="Masukkan Cookie / Access Token / UID (1 per baris)..."></textarea>

    <div class="controls-row">
      <button id="btnStart" onclick="startCheck()">⚡ MULAI CEK</button>

      <div class="speed-selector">
        <label for="concurrencySelect">KECEPATAN (THREADS):</label>
        <select id="concurrencySelect">
          <option value="5">5 / Detik (Lambat - Aman)</option>
          <option value="10" selected>10 / Detik (Sedang)</option>
          <option value="25">25 / Detik (Cepat)</option>
          <option value="50">50 / Detik (Ultra Cepat)</option>
        </select>
      </div>
    </div>

    <div class="counter">
      <div>TOTAL: <span id="txtTotal">0</span></div>
      <div class="counter-live">LIVE: <span id="txtLive">0</span></div>
      <div class="counter-dead">DEAD: <span id="txtDead">0</span></div>
    </div>

    <div class="result-box">
      <div>
        <div style="color: var(--neon-green); margin-bottom: 8px; font-weight:700;">LIVE ACCOUNTS</div>
        <div id="boxLive" class="res-panel live"></div>
      </div>
      <div>
        <div style="color: var(--neon-red); margin-bottom: 8px; font-weight:700;">DEAD / CHECKPOINT</div>
        <div id="boxDead" class="res-panel dead"></div>
      </div>
    </div>
  </div>

  <script>
    function parseCookieString(raw) {
      let uid = null;
      let token = null;

      const cUserMatch = raw.match(/c_user=([0-9]+)/);
      if (cUserMatch) uid = cUserMatch[1];

      const tokenMatch = raw.match(/access_token=(EAAA[a-zA-Z0-9]+)/);
      if (tokenMatch) token = tokenMatch[1];

      if (!uid) {
        const firstPart = raw.split('|')[0].trim();
        if (/^[0-9]+$/.test(firstPart)) {
          uid = firstPart;
        }
      }

      return { uid, token };
    }

    async function checkFBItem(item) {
      const { uid, token } = parseCookieString(item);

      if (token) {
        try {
          const res = await fetch(`https://graph.facebook.com/v18.0/me?access_token=${token}`);
          const data = await res.json();
          if (data && data.id && !data.error) return true;
        } catch (e) {}
      }

      if (uid) {
        try {
          const res = await fetch(`https://graph.facebook.com/${uid}/picture?type=normal&redirect=false`);
          const data = await res.json();
          if (data && data.data && data.data.url && !data.error) {
            return true;
          }
        } catch (e) {}
      }

      return false;
    }

    async function startCheck() {
      const rawText = document.getElementById('listData').value.trim();
      if (!rawText) return alert("Masukkan data cookie / UID terlebih dahulu!");

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const concurrencyLimit = parseInt(document.getElementById('concurrencySelect').value);
      const btn = document.getElementById('btnStart');

      btn.disabled = true;
      btn.innerText = 'PROSES...';

      document.getElementById('txtTotal').innerText = lines.length;
      document.getElementById('txtLive').innerText = 0;
      document.getElementById('txtDead').innerText = 0;
      document.getElementById('boxLive').innerHTML = '';
      document.getElementById('boxDead').innerHTML = '';

      let countLive = 0;
      let countDead = 0;
      let currentIndex = 0;

      // Pool pekerja paralel
      async function worker() {
        while (currentIndex < lines.length) {
          const index = currentIndex++;
          const line = lines[index];
          
          const isLive = await checkFBItem(line);

          if (isLive) {
            countLive++;
            document.getElementById('txtLive').innerText = countLive;
            document.getElementById('boxLive').innerHTML += `<div>[LIVE] ${line}</div>`;
          } else {
            countDead++;
            document.getElementById('txtDead').innerText = countDead;
            document.getElementById('boxDead').innerHTML += `<div>[DEAD] ${line}</div>`;
          }
        }
      }

      // Jalankan worker secara paralel sesuai batas thread yang dipilih
      const workers = [];
      for (let i = 0; i < Math.min(concurrencyLimit, lines.length); i++) {
        workers.push(worker());
      }

      await Promise.all(workers);

      btn.disabled = false;
      btn.innerText = '⚡ MULAI CEK';
    }
  </script>
</body>
</html>
